# Versione della configurazione del Risk Engine.
risk_engine_version: "0.1.0"

# Il Risk Engine produce esclusivamente livelli simulati.
paper_trading_only: true

# Nessun ordine demo o reale è consentito.
execution:
  real_orders_enabled: false
  demo_orders_enabled: false

# Prezzo utilizzato come riferimento teorico di ingresso.
entry:
  source: confirmed_candle_close

# Configurazione dello Stop Loss.
stop_loss:
  method: atr_and_minimum_percentage
  atr_multiplier: 1.5
  minimum_stop_percentage: 0.001

# Configurazione dei Take Profit in multipli di R.
take_profit:
  tp1_r: 1.0
  tp2_r: 2.0
  tp3_r: 3.0

# Regole di sicurezza.
safety:
  confirmed_signals_only: true
  no_levels_for_no_trade: true
  no_future_data: true
  immutable_confirmed_levels: true
  position_sizing_enabled: false