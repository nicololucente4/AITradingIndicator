# Versione del set di feature.
feature_set_version: "0.1.0"

# Le feature vengono calcolate esclusivamente a candela chiusa.
confirmed_candles_only: true

# Parametri iniziali per il timeframe operativo M15.
technical_features:
  ema_fast_period: 10
  ema_slow_period: 30
  atr_period: 14
  volatility_period: 20

# Feature abilitate nella prima versione.
enabled_features:
  - return_1
  - ema_fast
  - ema_slow
  - ema_distance_pct
  - true_range
  - atr
  - atr_pct
  - volatility

# Gestione del periodo iniziale necessario agli indicatori.
warmup:
  preserve_initial_nan: true
  drop_rows_during_model_preparation: true

# Protezioni contro l'utilizzo di dati futuri.
safety:
  allow_negative_shift: false
  allow_centered_rolling: false
  require_truncation_test: true